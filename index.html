<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="경영정보학과 이동수의 관심 분야와 좋아하는 것, 취미를 소개합니다."
    />
    <title>이동수 | 자기소개</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic",
          sans-serif;
        color: #17324d;
        background: #edf8ff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 8% 10%, #c8edff 0, transparent 34rem),
          radial-gradient(ellipse at 96% 62%, #e5dcff 0, transparent 30rem),
          linear-gradient(145deg, #f4fbff 0%, #eaf5ff 55%, #f5f0ff 100%);
      }

      button {
        font: inherit;
      }

      .page {
        width: min(100% - 40px, 920px);
        margin-inline: auto;
        padding-block: 48px 36px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: clamp(32px, 7vw, 68px);
        border: 1px solid rgb(255 255 255 / 65%);
        border-radius: 32px;
        background:
          radial-gradient(ellipse at 88% 18%, rgb(255 255 255 / 26%), transparent 14rem),
          linear-gradient(125deg, #277db8 0%, #47add0 52%, #8c9bea 100%);
        box-shadow: 0 24px 70px rgb(55 117 160 / 22%);
        animation: rise-in 650ms ease-out both;
      }

      .hero::after {
        position: absolute;
        top: -110px;
        right: -68px;
        width: 330px;
        aspect-ratio: 1;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 50%;
        box-shadow:
          0 0 0 28px rgb(255 255 255 / 10%),
          0 0 0 58px rgb(255 255 255 / 7%);
        content: "";
        pointer-events: none;
      }

      .hero-content {
        position: relative;
        z-index: 1;
        max-width: 65%;
      }

      .hero-art {
        position: absolute;
        top: 50%;
        right: 7%;
        width: 220px;
        height: 220px;
        transform: translateY(-50%);
      }

      .sticker {
        position: absolute;
        display: grid;
        width: 82px;
        height: 82px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 62%);
        border-radius: 27px;
        background: rgb(255 255 255 / 24%);
        box-shadow: 0 16px 35px rgb(22 66 112 / 16%);
        font-size: 2.8rem;
        backdrop-filter: blur(8px);
        animation: bob 3s ease-in-out infinite;
      }

      .sticker-strength {
        top: 14px;
        left: 63px;
        transform: rotate(9deg);
      }

      .sticker-ai {
        top: 104px;
        left: 5px;
        animation-delay: -1s;
        transform: rotate(-11deg);
      }

      .sticker-game {
        right: 8px;
        bottom: 3px;
        animation-delay: -2s;
        transform: rotate(8deg);
      }

      .art-sparkle {
        position: absolute;
        top: 17px;
        right: 9px;
        font-size: 2rem;
        animation: twinkle 1.8s ease-in-out infinite alternate;
      }

      .art-sparkle-small {
        right: 33px;
        bottom: 85px;
        color: #fff3a8;
        font-size: 1.4rem;
        animation-delay: -0.8s;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border: 1px solid rgb(255 255 255 / 38%);
        border-radius: 999px;
        color: #fff;
        background: rgb(255 255 255 / 16%);
        font-size: 0.88rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        backdrop-filter: blur(8px);
      }

      .eyebrow::before {
        content: "✨";
      }

      .tag {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        color: #2672a5;
        background: #dff2ff;
        font-size: 0.88rem;
        font-weight: 700;
      }

      h1 {
        margin: 25px 0 12px;
        color: #fff;
        font-size: clamp(2.8rem, 8vw, 5rem);
        letter-spacing: -0.075em;
        line-height: 1.08;
        text-shadow: 0 5px 24px rgb(17 59 97 / 18%);
      }

      .intro {
        max-width: 540px;
        margin: 0;
        color: rgb(255 255 255 / 92%);
        font-size: clamp(1rem, 2.5vw, 1.15rem);
        line-height: 1.8;
        word-break: keep-all;
      }

      .hero-note {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 26px 0 0;
        padding: 11px 15px;
        border: 1px solid rgb(255 255 255 / 22%);
        border-radius: 14px;
        color: #fff;
        background: rgb(255 255 255 / 15%);
        font-size: 0.9rem;
        font-weight: 600;
        backdrop-filter: blur(8px);
      }

      .section-heading {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 40px 0 16px;
        color: #204866;
        font-size: 1.28rem;
        letter-spacing: -0.03em;
      }

      .section-heading::after {
        width: 38px;
        height: 4px;
        margin-left: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg, #45b5d4, #a18be8);
        content: "";
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .card {
        position: relative;
        overflow: hidden;
        min-height: 188px;
        padding: 24px;
        border: 1px solid rgb(255 255 255 / 95%);
        border-radius: 24px;
        background: linear-gradient(145deg, var(--card-tint), #fff 82%);
        box-shadow: 0 12px 35px rgb(55 117 160 / 8%);
        backdrop-filter: blur(10px);
        animation: rise-in 650ms ease-out both;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      .card::before {
        position: absolute;
        top: 0;
        right: 20px;
        left: 20px;
        height: 4px;
        border-radius: 0 0 999px 999px;
        background: var(--card-accent);
        content: "";
      }

      .card:nth-child(1) {
        --card-accent: #45b7d1;
        --card-tint: #e7faff;
      }

      .card:nth-child(2) {
        --card-accent: #9c87e8;
        --card-tint: #f0edff;
        animation-delay: 80ms;
      }

      .card:nth-child(3) {
        --card-accent: #ff9a79;
        --card-tint: #fff0e8;
        animation-delay: 160ms;
      }

      .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 42px rgb(55 117 160 / 15%);
      }

      .card-icon {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(145deg, var(--card-tint), #fff);
        box-shadow: 0 5px 14px rgb(43 90 130 / 10%);
        font-size: 1.35rem;
      }

      .card h3 {
        margin: 17px 0 12px;
        color: #204866;
        font-size: 1.02rem;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .tag {
        padding: 7px 10px;
        font-size: 0.82rem;
      }

      .card:nth-child(3) .tag {
        color: #a44f35;
        background: #ffe4d7;
      }

      .message-area {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        margin-top: 24px;
        padding: 20px 22px;
        border: 1px solid rgb(255 255 255 / 90%);
        border-radius: 20px;
        background: linear-gradient(110deg, rgb(255 255 255 / 88%), #e9f4ff);
        box-shadow: 0 12px 30px rgb(55 117 160 / 7%);
      }

      .message-area p {
        flex: 1;
        min-width: 200px;
        margin: 0;
        color: #55738a;
        line-height: 1.7;
      }

      .message-area button {
        min-height: 44px;
        padding: 0 17px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: #328dc1;
        cursor: pointer;
        font-weight: 700;
        transition:
          background 160ms ease,
          transform 160ms ease;
      }

      .message-area button:hover {
        transform: translateY(-2px);
        background: #2377aa;
      }

      .message-area button:focus-visible {
        outline: 3px solid #85cfff;
        outline-offset: 3px;
      }

      .message-area button:active {
        transform: translateY(0);
      }

      footer {
        padding-top: 28px;
        color: #7892a6;
        font-size: 0.85rem;
        text-align: center;
      }

      @media (max-width: 680px) {
        .page {
          width: min(100% - 28px, 500px);
          padding-block: 20px 24px;
        }

        .hero {
          border-radius: 24px;
        }

        .hero-content {
          max-width: 100%;
        }

        .hero-art {
          top: auto;
          right: -25px;
          bottom: -34px;
          transform: scale(0.65);
          transform-origin: bottom right;
          opacity: 0.32;
        }

        .cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }

        .card {
          min-height: auto;
          padding: 20px;
        }

        .card h3 {
          margin-top: 14px;
        }

      }

      @media (max-width: 430px) {
        .cards {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(14px);
        }

        @keyframes bob {
          0%,
          100% {
            translate: 0 0;
          }

          50% {
            translate: 0 -10px;
          }
        }

        @keyframes twinkle {
          from {
            opacity: 0.5;
            scale: 0.8;
          }

          to {
            opacity: 1;
            scale: 1.15;
          }
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero-content">
          <span class="eyebrow">ABOUT ME</span>
          <h1>이동수 <span aria-hidden="true">👋</span></h1>
          <p class="intro">
            안녕하세요! 경영정보학과에서 공부하며 새로운 가능성을 탐구하고
            있습니다. 운동과 인공지능에 관심이 많아요.
          </p>
          <p class="hero-note">💪 좋아하는 것을 꾸준히 즐기며 성장하는 사람</p>
        </div>
        <div class="hero-art" aria-hidden="true">
          <span class="sticker sticker-strength">💪</span>
          <span class="sticker sticker-ai">🤖</span>
          <span class="sticker sticker-game">🎮</span>
          <span class="art-sparkle">✦</span>
          <span class="art-sparkle art-sparkle-small">✦</span>
        </div>
      </header>

      <main>
        <h2 class="section-heading">🧩 저를 소개합니다</h2>
        <div class="cards">
          <section class="card" aria-labelledby="study-title">
            <span class="card-icon" aria-hidden="true">🎓</span>
            <h3 id="study-title">전공</h3>
            <div class="tags">
              <span class="tag">경영정보학과</span>
            </div>
          </section>

          <section class="card" aria-labelledby="interest-title">
            <span class="card-icon" aria-hidden="true">💡</span>
            <h3 id="interest-title">관심 분야</h3>
            <div class="tags">
              <span class="tag">🏃 운동</span>
              <span class="tag">🤖 인공지능</span>
            </div>
          </section>

          <section class="card" aria-labelledby="favorite-title">
            <span class="card-icon" aria-hidden="true">✨</span>
            <h3 id="favorite-title">좋아하는 것과 취미</h3>
            <div class="tags">
              <span class="tag">🥩 고기</span>
              <span class="tag">🏋️ 헬스</span>
              <span class="tag">🎮 게임</span>
              <span class="tag">🎬 영화 감상</span>
              <span class="tag">🎧 노래 듣기</span>
            </div>
          </section>
        </div>

        <section class="message-area" aria-label="응원 메시지">
          <p id="message" aria-live="polite">
            💌 아래 버튼을 눌러 저에게 응원 한마디를 전해 보세요!
          </p>
          <button id="cheer-button" type="button">💌 응원 메시지 보내기</button>
        </section>
      </main>

      <footer>Made with 💙 by 이동수</footer>
    </div>

    <script>
      const cheerButton = document.querySelector("#cheer-button");
      const message = document.querySelector("#message");

      cheerButton.addEventListener("click", () => {
        message.textContent = "응원 고마워요! 오늘도 즐겁게 도전해 볼게요. 💪";
        cheerButton.textContent = "고마워요!";
      });
    </script>
  </body>
</html>
